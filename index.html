<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Face It">
<title>Face It</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0B0E13;--card:#161A20;--card2:#1C2027;--high:#272B33;--line:#2A2F37;--text:#E6E8ED;--muted:#8B949E;--dim:#6E7681;--pri:#3FB950;--pri2:#67DF70;--none:#161B22;--miss:#B5615F;--part:#A8E6B4;--good:#3FB950;--all:#1F8F3A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 4px) 20px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700;letter-spacing:-.015em;margin:4px 0 6px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.label.g{color:var(--pri2)}
.label svg{width:15px;height:15px}
.muted{color:var(--muted)}
.hint{color:var(--dim);font-size:13px;text-align:center;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.sec{margin-top:28px}
.title{font-size:17px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:600;font-size:16px;width:100%;margin-top:12px;transition:transform .12s;text-align:center}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.pri{background:var(--pri);color:#05200b}
.glow{box-shadow:0 0 0 1px rgba(103,223,112,.25),0 8px 30px rgba(63,185,80,.25)}
.quiet{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.ghost{color:var(--muted);height:44px;margin-top:4px}
.link{color:var(--pri2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:8px 0}
.link svg{width:16px;height:16px}
.t{font-variant-numeric:tabular-nums;color:var(--pri2);font-weight:700;min-width:48px}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}

/* to-do list */
.todo{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.cb{width:26px;height:26px;flex:none;border-radius:50%;box-shadow:inset 0 0 0 2px var(--dim);display:grid;place-items:center;color:transparent;transition:background .15s}
.cb svg{width:16px;height:16px;stroke-width:3}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tt{font-size:17px;font-weight:600;transition:color .15s}
.ts{font-size:13px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:13px;font-weight:700;color:var(--pri2);font-variant-numeric:tabular-nums}
.todo.done .cb{background:var(--pri);box-shadow:none;color:#05200b}
.todo.done .tt{text-decoration:line-through;text-decoration-thickness:2px;color:var(--dim)}
.todo.done .ts,.todo.done .tm{color:var(--dim);text-decoration:line-through}
.todo.off{opacity:.55}
.add{display:flex;gap:8px;margin-top:12px}
.add .txt{flex:1;min-width:0}
.add button{width:50px;flex:none;border-radius:14px;background:var(--high);color:var(--pri2);display:grid;place-items:center}
.add button svg{width:20px;height:20px}
.alldone{color:var(--pri2);font-size:14px;font-weight:600;text-align:center;margin-top:14px}

/* map */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 15px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--high);border-color:var(--pri);color:var(--pri2)}
.yr{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px;margin-top:14px}
.ml{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.ml.cur{color:var(--text)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mg i{display:block;aspect-ratio:1;border-radius:3px}
.mg i.is-today{outline:1.5px solid var(--text);outline-offset:1px}
.lv-none{background:var(--none);box-shadow:inset 0 0 0 1px var(--line)}
.lv-pending{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.lv-miss{background:var(--miss)}
.lv-part{background:var(--part)}
.lv-good{background:var(--good)}
.lv-all{background:var(--all)}
.lv-blank,.lv-future{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:18px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* words */
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:28px}
.seg button{flex:1;height:38px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;text-align:center}
.seg button.on{background:var(--high);color:var(--pri2)}
.hero{display:block;width:100%;padding:26px 22px}
.hero .q{font-size:23px;font-weight:600;line-height:1.35;letter-spacing:-.01em;margin-top:12px}
.hero .src{color:var(--pri2);font-size:13px;font-weight:600;margin-top:12px}
.hero .tap{color:var(--dim);font-size:12px;margin-top:14px}
.qi{padding:18px 0;border-bottom:1px solid var(--line)}
.qi:last-child{border-bottom:0}
.qi p{font-size:17px;line-height:1.45}
.qi .src{color:var(--pri2);font-size:12px;font-weight:600;margin-top:6px}
.qt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:22px 0 2px}

.txt,input[type=time]{font:inherit;font-size:16px;color:var(--text);background:#21262D;border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;width:100%}
.txt:focus,input[type=time]:focus{border-color:var(--pri)}
.prow{display:flex;gap:8px;align-items:center;margin-top:10px}
.prow input[type=time]{width:104px;flex:none;color:var(--pri2);font-weight:700;text-align:center;-webkit-appearance:none;appearance:none;min-height:50px}
.prow .txt{flex:1;min-width:0;min-height:50px}
.rm{width:40px;height:40px;flex:none;color:var(--dim);display:grid;place-items:center}
.rm svg{width:18px;height:18px}
.prow.locked{padding:12px 14px;background:var(--card);border-radius:14px;color:var(--muted);text-decoration:line-through}
.lrow{display:flex;width:100%;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px}
.lrow.danger{color:#E2A4A2}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(11,14,19,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs button.on{color:var(--pri2)}
nav.tabs svg{width:24px;height:24px}
.sw{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.sw.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;margin:0 auto;background:var(--card2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;transform:translateY(24px);transition:transform .25s}
.sw.open .sheet{transform:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--high);margin:0 auto 16px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--high);color:var(--text);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="sw" id="sw"><div class="sheet" id="sheet"></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
(()=>{
const KEY='faceit.v1';
const $=s=>document.querySelector(s);

// dates
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const dowIdx=d=>(d.getDay()+6)%7;
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDay=d=>DOW[dowIdx(d)]+' '+d.getDate()+' '+MON[d.getMonth()];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayNo=d=>Math.floor((d-new Date(2026,0,1))/864e5);

// daily must-haves
const CORE=[
 {k:'gym',l:'Gym',short:'Gym'},
 {k:'aff',l:'Affirmation',short:'Affirmation'},
 {k:'grat',l:'Gratefulness (prayer)',short:'Gratefulness'},
 {k:'refl',l:'Reflection & reframing',short:'Reflection'}
];

// data
let db=load();
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
 if(!d||!Array.isArray(d.fights))d={fights:[]};
 d.core=d.core||{};
 if(!d.coreStart)d.coreStart=ymd(today());
 delete d.reviews;
 return d;}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
save();

// icons
const sv=p=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
gear:sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
fight:sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/>'),
map:sv('<circle cx="12" cy="12" r="2.5"/><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M10.2 10.2 7.4 7.4M13.8 10.2l2.8-2.8M10.2 13.8l-2.8 2.8M13.8 13.8l2.8 2.8"/>'),
words:sv('<path d="M7 7h4v4c0 3-1.5 5-4 6M15 7h4v4c0 3-1.5 5-4 6"/>'),
check:sv('<polyline points="20 6 9 17 4 12"/>'),
x:sv('<path d="M18 6 6 18M6 6l12 12"/>'),
moon:sv('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
plus:sv('<path d="M12 5v14M5 12h14"/>')
};

// words
const AFF=[
 ['',[
  "I am worthy of success and happiness.",
  "I am capable of achieving my goals.",
  "I am grateful for the abundance in my life.",
  "I embrace challenges as opportunities to grow.",
  "I am in control of my destiny.",
  "I believe in myself.",
  "I attract success and prosperity.",
  "I am confident in my abilities and decisions.",
  "I am open to new possibilities and opportunities.",
  "I am resilient and can overcome any obstacle.",
  "Every effort I make moves me closer to my goals.",
  "I confidently take risks that lead to success.",
  "When I feel fear, I face it and fight it to win.",
  "Every challenge I overcome strengthens my path to success.",
  "I am enough, and my worth is not tied to external achievements."]]
];
const GRAT=[
 ['If you are grateful, I will surely give you more.','Quran 14:7'],
 ['So remember Me, I will remember you. Be grateful to Me and do not deny Me.','Quran 2:152'],
 ['So which of the favours of your Lord would you deny?','Quran 55:13'],
 ['If you tried to count the blessings of Allah, you could never number them.','Quran 14:34'],
 ['Whoever is grateful, is grateful for the good of his own soul.','Quran 31:12'],
 ['My Lord, enable me to be grateful for the favour You have given me and my parents, and to do good that pleases You.','Quran 27:19'],
 ['Indeed, with hardship comes ease.','Quran 94:6'],
 ['A person will have nothing except what he strives for.','Quran 53:39'],
 ['Allah does not change the condition of a people until they change what is in themselves.','Quran 13:11'],
 ['Once you have decided, put your trust in Allah.','Quran 3:159'],
 ['Whoever puts his trust in Allah, He is enough for him.','Quran 65:3'],
 ['Allah does not burden a soul beyond what it can bear.','Quran 2:286'],
 ['We made you into nations and tribes so that you may know one another.','Quran 49:13'],
 ['And speak good words to people.','Quran 2:83'],
 ['Whoever does not thank people has not thanked Allah.','Hadith, Abu Dawud and Tirmidhi'],
 ['How wonderful is the affair of the believer. If good comes to him, he is grateful, and that is good for him. If hardship comes, he is patient, and that is good for him.','Hadith, Sahih Muslim'],
 ['Look at those below you and not at those above you, so you do not belittle the blessings of Allah upon you.','Hadith, Sahih Muslim'],
 ['The strong believer is better and more beloved to Allah than the weak believer. Strive for what benefits you, seek help from Allah, and do not give up.','Hadith, Sahih Muslim'],
 ['Allah loves that when one of you does a job, he does it with excellence.','Hadith, al Bayhaqi'],
 ['The best of people are those most beneficial to people.','Hadith, al Tabarani'],
 ['Your smile in the face of your brother is charity.','Hadith, Tirmidhi'],
 ['Tie your camel, then put your trust in Allah.','Hadith, Tirmidhi'],
 ['Alhamdulillah ala kulli hal. Praise be to Allah in every situation.','Hadith, Ibn Majah']
];
const AFF_ALL=AFF.flatMap(([,a])=>a);
const off={a:0,g:0};
const affToday=()=>AFF_ALL[((dayNo(today())+off.a)%AFF_ALL.length+AFF_ALL.length)%AFF_ALL.length];
const gratToday=()=>GRAT[((dayNo(today())+off.g)%GRAT.length+GRAT.length)%GRAT.length];

// model
const timeKey=f=>f.time||'99:99';
function fightsOn(s){return db.fights.filter(f=>f.date===s).sort((a,b)=>timeKey(a).localeCompare(timeKey(b)));}
const isDone=f=>f.status==='won';
const coreOn=s=>s>=db.coreStart;
const coreDone=(s,k)=>!!(db.core[s]&&db.core[s][k]);
function dayStat(s){const fs=fightsOn(s);let total=fs.length,done=fs.filter(isDone).length;
 if(coreOn(s)){total+=CORE.length;done+=CORE.filter(c=>coreDone(s,c.k)).length;}return{total,done};}
function lvlAll(s){const ts=ymd(today()),st=dayStat(s);if(!st.total)return'none';
 if(st.done===st.total)return'all';if(st.done===0)return s===ts?'pending':'miss';
 const p=st.done/st.total;return p>=.5?'good':'part';}
function lvlCore(s,k){if(!coreOn(s))return'none';if(coreDone(s,k))return'all';return s===ymd(today())?'pending':'miss';}
function toggleCore(s,k){db.core[s]=db.core[s]||{};db.core[s][k]=!db.core[s][k];if(!db.core[s][k])delete db.core[s][k];save();}
function toggleFight(id){const f=db.fights.find(x=>x.id===id);if(!f)return;f.status=isDone(f)?'pending':'won';save();}

// ui
const gear=`<button class="icon" data-act="settings" aria-label="Settings">${I.gear}</button>`;
function todoRow({done,title,sub,time,tg,off}){return `<button class="todo ${done?'done':''} ${off?'off':''}" ${tg?`data-tg="${tg}"`:''}><span class="cb">${I.check}</span><span class="tx"><span class="tt">${esc(title)}</span>${sub?`<span class="ts">${esc(sub)}</span>`:''}</span>${time?`<span class="tm">${esc(time)}</span>`:''}</button>`;}
function coreRows(s,canTog){return CORE.map(c=>todoRow({done:coreDone(s,c.k),title:c.l,sub:c.k==='aff'&&s===ymd(today())?affToday():'',tg:canTog?`c|${c.k}|${s}`:'',off:!canTog})).join('');}
function fightRows(s,canTog){return fightsOn(s).map(f=>todoRow({done:isDone(f),title:f.text,time:f.time,tg:canTog?`f|${f.id}|${s}`:'',off:!canTog})).join('');}

const st={tab:'fight',flt:'all',wseg:'aff'};

// TODAY
function viewFight(){const t=today(),ts=ymd(t),tom=ymd(addDays(t,1));const fs=fightsOn(ts),s=dayStat(ts);
 let h=`<header class="top"><h1>Today</h1>${gear}</header><div class="label">${DOWL[dowIdx(t)]} ${t.getDate()} ${MONL[t.getMonth()]}</div>`;
 h+=`<div class="card"><div class="label g">Every day</div>${coreRows(ts,true)}</div>`;
 h+=`<div class="card"><div class="row between"><div class="label">Fights</div>${fs.length?`<button class="link" data-plan="${ts}">Edit</button>`:''}</div>${fightRows(ts,true)}
  <div class="add"><input class="txt" id="quick" maxlength="80" placeholder="Add a fight for today" enterkeyhint="done"><button id="quickbtn" aria-label="Add">${I.plus}</button></div></div>`;
 if(s.total&&s.done===s.total)h+=`<p class="alldone">All done. You kept your word today.</p>`;
 const tf=fightsOn(tom),evening=new Date().getHours()>=18;
 h+=`<div class="sec row between"><div class="label">Tomorrow</div>${tf.length?`<button class="link" data-plan="${tom}">Edit</button>`:''}</div>`;
 if(tf.length)h+=`<div class="card">${tf.map(f=>`<div class="li">${f.time?`<span class="t">${f.time}</span>`:''}<span>${esc(f.text)}</span></div>`).join('')}</div>`;
 else h+=`<button class="btn ${evening?'pri glow':'quiet'}" data-plan="${tom}">${I.moon} Plan tomorrow</button>`;
 h+=`<p class="hint">Your 4 daily must haves are added every day automatically.</p>`;
 return h;}
function bindQuick(){const inp=$('#quick'),btn=$('#quickbtn');if(!inp)return;
 const go=()=>{const v=inp.value.trim();if(!v)return;db.fights.push({id:uid(),date:ymd(today()),time:'',text:v,status:'pending'});save();render();toast('Added');};
 btn.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};}

// MAP: 12 month vertical overview with activity filter
const FLT=[['all','All'],...CORE.map(c=>[c.k,c.short])];
function monthBlock(y,m,t,lvlFn){const first=new Date(y,m,1),last=new Date(y,m+1,0),ts=ymd(t);
 let cells='<i class="lv-blank"></i>'.repeat(dowIdx(first));
 for(let d=new Date(first);d<=last;d=addDays(d,1)){const ds=ymd(d);
  if(d>t){cells+='<i class="lv-future"></i>';continue;}
  cells+=`<i class="lv-${lvlFn(ds)} ${ds===ts?'is-today':''}" data-day="${ds}"></i>`;}
 const lab=MON[m]+((m===0||(y!==t.getFullYear()))&&m!==t.getMonth()?' '+String(y).slice(2):'');
 return `<div><div class="ml ${y===t.getFullYear()&&m===t.getMonth()?'cur':''}">${m===0?MON[m]+' '+y:lab}</div><div class="mg">${cells}</div></div>`;}
function viewMap(){const t=today();const f=st.flt;
 const lvlFn=f==='all'?lvlAll:(ds=>lvlCore(ds,f));
 let blocks='';for(let k=-11;k<=0;k++){const a=new Date(t.getFullYear(),t.getMonth()+k,1);blocks+=monthBlock(a.getFullYear(),a.getMonth(),t,lvlFn);}
 const start=new Date(t.getFullYear(),t.getMonth()-11,1);
 const name=f==='all'?'All activities':CORE.find(c=>c.k===f).l;
 const leg=f==='all'?[['none','No plan'],['miss','Missed'],['part','Some'],['good','Most'],['all','All done']]:[['none','No data'],['miss','Missed'],['all','Done']];
 return `<header class="top"><h1>Map</h1>${gear}</header>
 <div class="chips">${FLT.map(([k,l])=>`<button class="${f===k?'on':''}" data-flt="${k}">${l}</button>`).join('')}</div>
 <div class="card"><div class="label">Last 12 months</div><div class="title" style="margin-top:2px">${esc(name)}</div><p class="muted" style="font-size:13px">${MON[start.getMonth()]} ${start.getFullYear()} to ${fmtDay(t)}</p>
 <div class="yr">${blocks}</div>
 <div class="legend">${leg.map(([k,l])=>`<span><i class="lv-${k}"></i>${l}</span>`).join('')}</div></div>
 <p class="hint">Tap any day to see or fix it.</p>`;}

// WORDS
function viewWords(){const g=gratToday();
 let list='';
 if(st.wseg==='aff')list=AFF.map(([th,a])=>`${th?`<div class="qt">${th}</div>`:''}${a.map(x=>`<div class="qi"><p>${esc(x)}</p></div>`).join('')}`).join('');
 else list=GRAT.map(([q,s])=>`<div class="qi"><p>${esc(q)}</p><div class="src">${esc(s)}</div></div>`).join('');
 return `<header class="top"><h1>Words</h1>${gear}</header>
 <button class="card hero" data-next="a"><div class="label g">I am</div><div class="q">${esc(affToday())}</div><div class="tap">Tap for another</div></button>
 <button class="card hero" data-next="g"><div class="label">Alhamdulillah</div><div class="q" style="font-size:20px;font-weight:500">${esc(g[0])}</div><div class="src">${esc(g[1])}</div><div class="tap">Tap for another</div></button>
 <div class="seg"><button class="${st.wseg==='aff'?'on':''}" data-wseg="aff">Affirmations</button><button class="${st.wseg==='grat'?'on':''}" data-wseg="grat">Gratitude</button></div>
 <div style="margin-top:6px">${list}</div>`;}

// SHEETS
function openSheet(html){$('#sheet').innerHTML='<div class="handle"></div>'+html;$('#sw').classList.add('open');}
function closeSheet(){$('#sw').classList.remove('open');}
$('#sw').addEventListener('click',e=>{if(e.target.id==='sw')closeSheet();});
function openPlanner(ds){const t=today(),isTom=ds===ymd(addDays(t,1)),isToday=ds===ymd(t);
 const locked=fightsOn(ds).filter(isDone);
 let rows=fightsOn(ds).filter(f=>!isDone(f)).map(f=>({time:f.time||'',text:f.text}));
 if(!rows.length)rows=[{time:'',text:''}];
 const draw=()=>{openSheet(`<div class="label g">${I.moon} ${isTom?'Night plan':'Plan'}</div>
  <h2>${isTom?'Tomorrow I will fight':isToday?'Today I will fight':fmtDay(parse(ds))+', I will fight'}</h2><p class="muted">Small and specific. Time is optional.</p>
  ${locked.map(f=>`<div class="prow locked">${f.time?`<span class="t">${f.time}</span>`:''}<span>${esc(f.text)}</span></div>`).join('')}
  ${rows.map((r,i)=>`<div class="prow"><input type="time" class="tin" data-i="${i}" value="${r.time}"><input class="txt" data-i="${i}" maxlength="80" placeholder="What will you face?" value="${esc(r.text)}"><button class="rm" data-rm="${i}" aria-label="Remove">${I.x}</button></div>`).join('')}
  <button class="link" id="addf">${I.plus} Add fight</button>
  <p class="hint">Gym, affirmation, gratefulness and reflection are added automatically.</p>
  <button class="btn pri glow" id="commit">${I.check} Commit</button><button class="btn ghost" id="cancel">Cancel</button>`);
  const sh=$('#sheet');
  sh.querySelectorAll('.tin').forEach(el=>el.oninput=()=>{rows[+el.dataset.i].time=el.value;});
  sh.querySelectorAll('.txt').forEach(el=>el.oninput=()=>{rows[+el.dataset.i].text=el.value;});
  sh.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>{rows.splice(+el.dataset.rm,1);draw();});
  $('#addf').onclick=()=>{rows.push({time:'',text:''});draw();const ins=sh.querySelectorAll('.txt');if(ins.length)ins[ins.length-1].focus();};
  $('#cancel').onclick=closeSheet;
  $('#commit').onclick=()=>{const ok=rows.filter(r=>r.text.trim());
   db.fights=db.fights.filter(f=>!(f.date===ds&&!isDone(f)));
   ok.forEach(r=>db.fights.push({id:uid(),date:ds,time:r.time||'',text:r.text.trim(),status:'pending'}));
   save();closeSheet();render();toast(isTom?'Committed. Rest well.':'Saved.');};};
 draw();}
function openDay(ds){const d=parse(ds),t=today(),canTog=d<=t,fs=fightsOn(ds);
 let h=`<div class="label">${d.getFullYear()}</div><h2>${DOWL[dowIdx(d)]} ${d.getDate()} ${MONL[d.getMonth()]}</h2>`;
 if(coreOn(ds))h+=`<div class="label g" style="margin-top:14px">Every day</div>${coreRows(ds,canTog)}`;
 if(fs.length)h+=`<div class="label" style="margin-top:18px">Fights</div>${fightRows(ds,canTog)}`;
 if(!coreOn(ds)&&!fs.length)h+=`<p class="muted" style="margin-top:8px">Nothing was planned this day.</p>`;
 if(ds>=ymd(t))h+=`<button class="btn quiet" data-plan="${ds}">${fs.length?'Edit fights':'Plan fights'}</button>`;
 openSheet(h);}
function openSettings(){const hasDemo=db.fights.some(f=>f.demo);
 openSheet(`<h2>Settings</h2>
 <button class="lrow" data-act="exp-json">Back up data <span class="muted">JSON</span></button>
 <button class="lrow" data-act="imp-json">Restore from backup</button>
 <button class="lrow" data-act="exp-csv">Export to spreadsheet <span class="muted">CSV</span></button>
 <button class="lrow" data-act="${hasDemo?'undemo':'demo'}">${hasDemo?'Remove sample data':'Load sample data'}</button>
 <button class="lrow danger" data-act="wipe">Erase all data</button>
 <p class="hint">Your data lives only on this phone. Back up now and then.</p>
 <p class="hint">Face It v2.0</p>`);}

// actions
async function shareFile(name,text,type){const file=new File([text],name,{type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return;}catch(e){if(e.name==='AbortError')return;}}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function demo(){const t=today(),texts=['Prepare 2 interview cases','Speak up in the meeting','Call instead of email','Ask one question','Read 20 pages','No phone after 22:00'];
 db.demoCore={};
 for(let i=365;i>=1;i--){if(Math.random()<.1)continue;const d=addDays(t,-i),ds=ymd(d),prog=1-i/365,n=Math.floor(Math.random()*4);
  db.demoCore[ds]={};CORE.forEach(c=>{if(Math.random()<.45+.45*prog)db.demoCore[ds][c.k]=true;});
  for(let k=0;k<n;k++)db.fights.push({id:uid(),date:ds,time:'',text:texts[Math.floor(Math.random()*texts.length)],status:Math.random()<.4+.45*prog?'won':'pending',demo:true});}
 db.demoBackup={core:db.core,coreStart:db.coreStart};
 db.core=Object.assign({},db.demoCore,db.core);db.coreStart=ymd(addDays(t,-365));delete db.demoCore;save();}
function undemo(){db.fights=db.fights.filter(f=>!f.demo);if(db.demoBackup){db.core=db.demoBackup.core;db.coreStart=db.demoBackup.coreStart;delete db.demoBackup;}save();}
function doAct(a){
 if(a==='settings')return openSettings();
 if(a==='exp-json')return shareFile('face-it-backup-'+ymd(today())+'.json',JSON.stringify(db,null,1),'application/json');
 if(a==='imp-json')return $('#imp').click();
 if(a==='exp-csv'){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['date','type','item','time','done']];
  const dates=new Set(db.fights.map(f=>f.date));for(let d=parse(db.coreStart);d<=today();d=addDays(d,1))dates.add(ymd(d));
  [...dates].sort().forEach(ds=>{if(coreOn(ds)&&ds<=ymd(today()))CORE.forEach(c=>rows.push([ds,'daily',c.l,'',coreDone(ds,c.k)?'yes':'no']));fightsOn(ds).forEach(f=>rows.push([ds,'fight',f.text,f.time||'',isDone(f)?'yes':'no']));});
  return shareFile('face-it-'+ymd(today())+'.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');}
 if(a==='demo'){if(confirm('Add 12 months of sample data to preview the app? You can remove it later in Settings.')){demo();closeSheet();render();toast('Sample data loaded');}return;}
 if(a==='undemo'){undemo();closeSheet();render();toast('Sample data removed');return;}
 if(a==='wipe'){if(confirm('Erase all data? This cannot be undone.')){db={fights:[],core:{},coreStart:ymd(today())};save();closeSheet();render();toast('All data erased');}return;}}
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.fights))throw 0;localStorage.setItem(KEY,JSON.stringify(d));db=load();save();closeSheet();render();toast('Backup restored');}catch(err){toast('That file is not a Face It backup');}e.target.value='';};
 r.readAsText(f);});

document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-tg],[data-plan],[data-flt],[data-wseg],[data-next],[data-day],[data-act]');if(!b)return;const d=b.dataset;
 if(d.tab){st.tab=d.tab;render();window.scrollTo(0,0);return;}
 if(d.tg){const[type,id,ds]=d.tg.split('|');if(type==='c')toggleCore(ds,id);else toggleFight(id);
  if(navigator.vibrate)navigator.vibrate(10);
  if($('#sw').classList.contains('open')){openDay(ds);}render();return;}
 if(d.plan)return openPlanner(d.plan);
 if(d.flt){st.flt=d.flt;render();return;}
 if(d.wseg){st.wseg=d.wseg;render();return;}
 if(d.next){off[d.next]++;render();return;}
 if(d.day)return openDay(d.day);
 if(d.act)doAct(d.act);});

function toast(m){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900);}
function render(){$('#app').innerHTML=st.tab==='fight'?viewFight():st.tab==='map'?viewMap():viewWords();
 $('#tabs').innerHTML=[['fight','Today',I.fight],['map','Map',I.map],['words','Words',I.words]].map(([k,l,ic])=>`<button class="${st.tab===k?'on':''}" data-tab="${k}">${ic}<span>${l}</span></button>`).join('');
 if(st.tab==='fight')bindQuick();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sw').classList.contains('open')&&document.activeElement.id!=='quick')render();});

// home screen icon for iPhone
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0B0E13';x.fillRect(0,0,180,180);x.strokeStyle='#3FB950';x.lineWidth=12;x.beginPath();x.arc(90,90,52,0,Math.PI*2);x.stroke();x.fillStyle='#67DF70';x.beginPath();x.arc(90,90,20,0,Math.PI*2);x.fill();const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
})();
</script>
</body>
