<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Face It">
<title>Face It</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0B0E13;--card:#161A20;--card2:#1C2027;--high:#272B33;--line:#2A2F37;--text:#E6E8ED;--muted:#8B949E;--dim:#6E7681;--pri:#3FB950;--pri2:#67DF70;--wash:rgba(63,185,80,.14);--none:#161B22;--miss:#B5615F;--part:#A8E6B4;--good:#3FB950;--all:#1F8F3A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 4px) 20px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;height:60px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700;letter-spacing:-.015em;margin:4px 0 6px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.label.g{color:var(--pri2)}
.label.r{color:#E2A4A2}
.label svg{width:15px;height:15px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hint{color:var(--dim);font-size:13px;text-align:center;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.sec{margin-top:28px}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.huge{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:600;font-size:16px;width:100%;margin-top:12px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.pri{background:var(--pri);color:#05200b}
.pri:active{background:#238636}
.glow{box-shadow:0 0 0 1px rgba(103,223,112,.25),0 8px 30px rgba(63,185,80,.25)}
.quiet{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.ghost{color:var(--muted);height:44px;margin-top:4px}
.link{color:var(--pri2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:8px 0}
.link svg{width:16px;height:16px}
.focus p{font-style:italic;margin-top:6px;font-size:16px}
.fight .time{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.fight .ft{font-size:18px;font-weight:600;margin-top:2px}
.fight.done .time,.fight.done .ft{color:var(--muted)}
.fight.miss .time,.fight.miss .ft{color:var(--dim)}
.ok{color:var(--pri2);font-size:13px;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:6px}
.ok svg{width:15px;height:15px}
.nt{color:var(--muted);font-size:13px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{margin-top:14px}
.circle{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--pri);color:#05200b}
.circle svg{width:24px;height:24px}
.ringbox{position:relative;flex:none;display:grid;place-items:center}
.ringbox b{position:absolute;font-size:15px;font-weight:700}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.t{font-variant-numeric:tabular-nums;color:var(--pri2);font-weight:700;min-width:48px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;height:38px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--high);color:var(--pri2)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.arrows{display:flex;gap:6px}
.arrows button{width:36px;height:36px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.arrows svg{width:18px;height:18px}
.title{font-size:17px;font-weight:600}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:12px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .dl{font-size:11px;font-weight:600;opacity:.85}
.day .dn{font-size:18px;font-weight:700}
.day .dc{font-size:11px;font-weight:700;opacity:.9}
.is-today{outline:2px solid var(--text);outline-offset:2px}
.fut{opacity:.45}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--dim);text-align:center;font-weight:600}
.cal button{aspect-ratio:1;border-radius:10px;font-size:13px;font-weight:600;display:grid;place-items:center}
.mlab{display:grid;grid-template-columns:repeat(26,1fr);font-size:10px;color:var(--muted);height:14px;margin-bottom:4px}
.mlab span{white-space:nowrap}
.hm{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.hm i{display:block;aspect-ratio:1;border-radius:3px}
.hm i.is-today{outline:1.5px solid var(--text);outline-offset:1px}
.lv-none{background:var(--none);box-shadow:inset 0 0 0 1px var(--line);color:var(--dim)}
.lv-pending{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted);color:var(--text)}
.lv-miss{background:var(--miss);color:#fff}
.lv-part{background:var(--part);color:#06240e}
.lv-good{background:var(--good);color:#05200b}
.lv-all{background:var(--all);color:#fff}
.lv-future{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:14px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.chip.up{background:var(--wash);color:var(--pri2)}
.chip.down{background:rgba(181,97,95,.16);color:#E2A4A2}
.chip.flat{background:var(--high);color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.bars{display:flex;gap:10px;height:130px;margin-top:14px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bt{flex:1;width:100%;display:flex;align-items:flex-end}
.bv{width:100%;border-radius:8px 8px 4px 4px}
.bar span{font-size:11px;color:var(--muted)}
.bar em{font-style:normal;font-size:12px;font-weight:700}
.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.pills span{height:36px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.won{background:var(--pri2)}
.dot.missed{background:var(--miss)}
.dot.pending{box-shadow:inset 0 0 0 1.5px var(--muted)}
.insight{background:rgba(181,97,95,.07);border-color:rgba(181,97,95,.3)}
.ins{margin-top:4px}
.ins li{margin:8px 0 0 18px;line-height:1.45}
.reasons{display:grid;gap:10px;margin-top:14px}
.rsn{text-align:left;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.rsn b{font-size:16px}
.rsn span{font-size:13px;color:var(--muted)}
.rsn.on{border-color:var(--miss);background:rgba(181,97,95,.14)}
.rchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--high);color:var(--muted)}
.r-excuse{background:rgba(181,97,95,.22);color:#F0C0BE}
.loss{padding:12px 0;border-bottom:1px solid var(--line)}
.loss:last-child{border-bottom:0}
.rrow{display:grid;grid-template-columns:130px 1fr 28px;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.rrow b{text-align:right}
.rb{height:8px;background:var(--high);border-radius:99px;overflow:hidden}
.rb i{display:block;height:100%;border-radius:99px}
textarea,.txt,input[type=time]{font:inherit;font-size:16px;color:var(--text);background:#21262D;border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;width:100%}
textarea:focus,.txt:focus,input[type=time]:focus{border-color:var(--pri)}
textarea{resize:none;margin-top:12px}
.prow{display:flex;gap:8px;align-items:center;margin-top:10px}
.prow input[type=time]{width:104px;flex:none;color:var(--pri2);font-weight:700;text-align:center;-webkit-appearance:none;appearance:none;min-height:50px}
.prow .txt{flex:1;min-width:0;min-height:50px}
.rm{width:40px;height:40px;flex:none;color:var(--dim);display:grid;place-items:center}
.rm svg{width:18px;height:18px}
.prow.locked{padding:12px 14px;background:var(--card);border-radius:14px;color:var(--muted)}
.tip b{font-size:15px}
.tip p{font-size:14px;margin-top:4px}
.mini{display:flex;gap:8px;margin-top:10px}
.mini button{flex:1;height:38px;border-radius:10px;background:var(--high);font-size:13px;font-weight:600;color:var(--muted)}
.mini .on{background:var(--pri);color:#05200b}
.mini .onm{background:rgba(181,97,95,.25);color:#F0C0BE}
.li2{padding:12px 0;border-bottom:1px solid var(--line)}
.lrow{display:flex;width:100%;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px;text-align:left}
.lrow.danger{color:#E2A4A2}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(11,14,19,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs button.on{color:var(--pri2)}
nav.tabs svg{width:24px;height:24px}
.sw{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.sw.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;margin:0 auto;background:var(--card2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow-y:auto;transform:translateY(24px);transition:transform .25s}
.sw.open .sheet{transform:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--high);margin:0 auto 16px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--high);color:var(--text);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty .title{font-size:18px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="sw" id="sw"><div class="sheet" id="sheet"></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
(()=>{
const KEY='faceit.v1';
const $=s=>document.querySelector(s);
let db=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.fights))return Object.assign({reviews:{}},d);}catch(e){}return{fights:[],reviews:{}};}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}

// dates
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const dowIdx=d=>(d.getDay()+6)%7;
const mondayOf=d=>addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-dowIdx(d));
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDay=d=>DOW[dowIdx(d)]+' '+d.getDate()+' '+MON[d.getMonth()];
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const nextHour=()=>pad(Math.min(23,new Date().getHours()+1))+':00';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-y0)/864e5+1)/7);}
const RS={excuse:'Excuse',event:'Unplanned event'};
const reasonTxt=f=>RS[f.reason]||'No reason given';

// icons
const sv=p=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={
gear:sv('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
fight:sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/>'),
map:sv('<circle cx="12" cy="12" r="2.5"/><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><path d="M10.2 10.2 7.4 7.4M13.8 10.2l2.8-2.8M10.2 13.8l-2.8 2.8M13.8 13.8l2.8 2.8"/>'),
cal:sv('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'),
check:sv('<polyline points="20 6 9 17 4 12"/>'),
x:sv('<path d="M18 6 6 18M6 6l12 12"/>'),
moon:sv('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'),
plus:sv('<path d="M12 5v14M5 12h14"/>'),
left:sv('<polyline points="15 18 9 12 15 6"/>'),
right:sv('<polyline points="9 18 15 12 9 6"/>')
};

// scoring
function fightsOn(s){return db.fights.filter(f=>f.date===s).sort((a,b)=>a.time.localeCompare(b.time));}
function eff(f){if(f.status!=='pending')return f.status;return f.date<ymd(today())?'missed':'pending';}
function dayStat(s){const fs=fightsOn(s);let won=0,res=0;for(const f of fs){const e=eff(f);if(e==='won'){won++;res++;}else if(e==='missed')res++;}return{planned:fs.length,won,res,pending:fs.length-res};}
function lvl(s){if(!s.planned)return'none';if(s.res===0)return'pending';if(s.won===0)return s.pending?'pending':'miss';const p=s.won/s.planned;if(p>=1)return'all';if(p>=.5)return'good';return'part';}
function lvlPct(p){if(p==null)return'none';if(p===0)return'miss';if(p<.5)return'part';if(p<1)return'good';return'all';}
function periodStat(start,end){const t=today();let won=0,res=0,days=0,allDone=0,best=null,bestD=null;
 for(let d=new Date(start);d<=end&&d<=t;d=addDays(d,1)){const s=dayStat(ymd(d));if(!s.planned)continue;days++;won+=s.won;res+=s.res;
  if(s.res===s.planned){const p=s.won/s.planned;if(p===1)allDone++;if(best==null||p>best){best=p;bestD=new Date(d);}}}
 return{won,res,days,allDone,best,bestD,pct:res?won/res:null};}
function lossesIn(a,b){const t=ymd(today()),A=ymd(a),B=ymd(b),L=[];let tot=0;
 for(const f of db.fights){if(f.date<A||f.date>B||f.date>t)continue;const e=eff(f);if(e==='pending')continue;tot++;if(e==='missed')L.push(f);}
 L.sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));return{L,tot};}

// ui helpers
const pctTxt=p=>p==null?'·':Math.round(p*100)+'%';
function ringBox(frac,size,label,color){const r=15.5,c=2*Math.PI*r;return `<div class="ringbox" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 36 36" style="transform:rotate(-90deg)"><circle cx="18" cy="18" r="${r}" fill="none" stroke="#272B33" stroke-width="3"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="${color||'#67DF70'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,frac)))}"/></svg><b>${label}</b></div>`;}
function chip(cur,prev,lbl){if(cur==null)return'';if(prev==null)return `<span class="chip flat">No data ${lbl}</span>`;const d=Math.round((cur-prev)*100);const cls=d>0?'up':d<0?'down':'flat';return `<span class="chip ${cls}">${d>0?'+':''}${d} pts ${lbl}</span>`;}
const legend=()=>`<div class="legend">${[['none','No plan'],['miss','Missed'],['part','Some'],['good','Most'],['all','All done']].map(([k,l])=>`<span><i class="lv-${k}"></i>${l}</span>`).join('')}</div>`;
const gear=`<button class="icon" data-act="settings" aria-label="Settings">${I.gear}</button>`;
function summary(lbl,p,ch,sub){return `<div class="card row between"><div><div class="label">${lbl}</div><div class="huge">${pctTxt(p)}</div>${ch}<p class="muted" style="margin-top:8px;font-size:13px">${sub}</p></div>${ringBox(p||0,76,'')}</div>`;}
const small=(l,v,s)=>`<div class="card" style="margin-top:12px"><div class="label">${l}</div><div class="sv">${v}</div><p class="muted" style="font-size:13px">${s}</p></div>`;

// state
const st={tab:'fight',map:'week',wk:0,mo:0,rv:0,rs:'week'};
let after=null;

// FIGHT
function fightCard(f){const e=eff(f);
 if(e==='won')return `<div class="card fight done"><div class="row between"><div><div class="time">${f.time}</div><div class="ft">${esc(f.text)}</div><div class="ok">${I.check} Won${f.doneAt?' at '+f.doneAt:''}</div></div><button class="circle" data-undo="${f.id}" aria-label="Undo">${I.check}</button></div></div>`;
 if(e==='missed')return `<div class="card fight miss"><div class="row between"><div><div class="time">${f.time}</div><div class="ft">${esc(f.text)}</div><div class="nt">Not today · ${reasonTxt(f)}${f.note?' · '+esc(f.note):''}</div></div><button class="link" data-undo="${f.id}">Undo</button></div></div>`;
 return `<div class="card fight"><div class="time">${f.time}</div><div class="ft">${esc(f.text)}</div><div class="two"><button class="btn quiet" data-miss="${f.id}">${I.x} Not today</button><button class="btn pri" data-won="${f.id}">${I.check} Won</button></div></div>`;}
function viewFight(){const t=today(),ts=ymd(t),tom=ymd(addDays(t,1));const fs=fightsOn(ts),s=dayStat(ts);
 const focus=(db.reviews[ymd(mondayOf(t))]||{}).focus;
 let h=`<header class="top"><h1>Fight</h1>${gear}</header><div class="label">Today, ${DOWL[dowIdx(t)]} ${t.getDate()} ${MONL[t.getMonth()]}</div>`;
 if(focus)h+=`<div class="card focus"><div class="label g">This week's focus</div><p>${esc(focus)}</p></div>`;
 if(fs.length){
  const msg=s.pending?`${s.won} of ${s.planned} won`:(s.won===s.planned?'All done':'Day closed');
  const sub=s.pending?'You decided this last night. Keep your word.':(s.won===s.planned?'You kept your word today.':'Noticing counts. Tomorrow is a new fight.');
  h+=`<div class="card row between"><div><div class="big">${msg}</div><p class="muted" style="margin-top:4px">${sub}</p></div>${ringBox(s.won/s.planned,68,s.won+'/'+s.planned)}</div>`;
  h+=fs.map(fightCard).join('');
 }else h+=`<div class="card empty"><div class="title">No fights planned for today</div><p class="muted" style="margin-top:4px">Pick one small thing you usually avoid.</p><button class="btn quiet" data-plan="${ts}">${I.plus} Plan today</button></div>`;
 const tf=fightsOn(tom),evening=new Date().getHours()>=18;
 h+=`<div class="sec row between"><div class="label">Tomorrow</div>${tf.length?`<button class="link" data-plan="${tom}">Edit</button>`:''}</div>`;

 else h+=`<button class="btn ${evening?'pri glow':'quiet'}" data-plan="${tom}">${I.moon} Plan tomorrow</button><p class="hint">Best done before sleep. 1 to 3 small fights, each with a time.</p>`;
 return h;}

// MAP
function viewMap(){let h=`<header class="top"><h1>Map</h1>${gear}</header><div class="seg">${[['week','Week'],['month','Month'],['six','6 months']].map(([k,l])=>`<button class="${st.map===k?'on':''}" data-seg="${k}">${l}</button>`).join('')}</div>`;
 return h+(st.map==='week'?weekView():st.map==='month'?monthView():sixView());}
function weekView(){const t=today(),ws=addDays(mondayOf(t),7*st.wk),we=addDays(ws,6);
 const cur=periodStat(ws,we),prev=periodStat(addDays(ws,-7),addDays(ws,-1));
 let cells='';for(let i=0;i<7;i++){const d=addDays(ws,i),ds=ymd(d),s=dayStat(ds),fut=d>t;
  cells+=`<button class="day lv-${lvl(s)} ${ds===ymd(t)?'is-today':''} ${fut&&!s.planned?'fut':''}" data-day="${ds}"><span class="dl">${DOW[i][0]}</span><span class="dn">${d.getDate()}</span><span class="dc">${s.planned?s.won+'/'+s.planned:'·'}</span></button>`;}
 const title=st.wk===0?'This week':st.wk===-1?'Last week':'Week '+isoWeek(ws);
 return `<div class="card"><div class="nav"><div><div class="label">Week ${isoWeek(ws)}</div><div class="title">${ws.getDate()} ${MON[ws.getMonth()]} to ${we.getDate()} ${MON[we.getMonth()]}</div></div><div class="arrows"><button data-nav="wk,-1">${I.left}</button><button data-nav="wk,1" ${st.wk>=0?'disabled':''}>${I.right}</button></div></div><div class="days7">${cells}</div>${legend()}</div>
 ${summary(title,cur.pct,chip(cur.pct,prev.pct,'vs last week'),`${cur.won} of ${cur.res} fights won`)}
 <div class="grid2">${small('All done days',cur.allDone,'days at 100%')}${small('Best day',cur.bestD?DOW[dowIdx(cur.bestD)]:'·',cur.best!=null?Math.round(cur.best*100)+'% won':'no data yet')}</div>`;}
function monthView(){const t=today(),m0=new Date(t.getFullYear(),t.getMonth()+st.mo,1),mE=new Date(m0.getFullYear(),m0.getMonth()+1,0);
 const p0=new Date(m0.getFullYear(),m0.getMonth()-1,1),pE=new Date(m0.getFullYear(),m0.getMonth(),0);
 const cur=periodStat(m0,mE),prev=periodStat(p0,pE);
 let cells=DOW.map(d=>`<div class="h">${d[0]}</div>`).join('')+'<span></span>'.repeat(dowIdx(m0));
 for(let d=new Date(m0);d<=mE;d=addDays(d,1)){const ds=ymd(d),s=dayStat(ds);cells+=`<button class="lv-${lvl(s)} ${ds===ymd(t)?'is-today':''} ${d>t&&!s.planned?'fut':''}" data-day="${ds}">${d.getDate()}</button>`;}
 const title=st.mo===0?'This month':MONL[m0.getMonth()];
 return `<div class="card"><div class="nav"><div><div class="label">${m0.getFullYear()}</div><div class="title">${MONL[m0.getMonth()]}</div></div><div class="arrows"><button data-nav="mo,-1">${I.left}</button><button data-nav="mo,1" ${st.mo>=0?'disabled':''}>${I.right}</button></div></div><div class="cal">${cells}</div>${legend()}</div>
 ${summary(title,cur.pct,chip(cur.pct,prev.pct,'vs last month'),`${cur.won} of ${cur.res} fights won`)}
 <div class="grid2">${small('All done days',cur.allDone,'days at 100%')}${small('Days planned',cur.days,'days with a fight')}</div>`;}
function sixView(){const t=today(),start=addDays(mondayOf(t),-7*25);let cells='',labs='';
 for(let c=0;c<26;c++){const cm=addDays(start,7*c);let lab='';
  for(let r=0;r<7;r++){const d=addDays(cm,r);if(d.getDate()===1&&d<=t)lab=MON[d.getMonth()];}
  labs+=`<span>${lab}</span>`;
  for(let r=0;r<7;r++){const d=addDays(cm,r),ds=ymd(d);if(d>t){cells+='<i class="lv-future"></i>';continue;}cells+=`<i class="lv-${lvl(dayStat(ds))} ${ds===ymd(t)?'is-today':''}" data-day="${ds}"></i>`;}}
 const ps=periodStat(start,t);const months=[];
 for(let k=-5;k<=0;k++){const a=new Date(t.getFullYear(),t.getMonth()+k,1),b=new Date(a.getFullYear(),a.getMonth()+1,0);months.push({l:MON[a.getMonth()],p:periodStat(a,b).pct});}
 const vals=months.map(m=>m.p).filter(p=>p!=null);let trend='<span class="chip flat">Not enough data yet</span>';
 if(vals.length>=2){const h=Math.floor(vals.length/2),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;const d=avg(vals.slice(vals.length-h))-avg(vals.slice(0,h));
  trend=d>.05?'<span class="chip up">Progressing ↑</span>':d<-.05?'<span class="chip down">Slipping ↓</span>':'<span class="chip flat">Steady</span>';}
 return `<div class="card"><div class="label">Last 6 months</div><div class="title" style="margin:2px 0 12px">${fmtDay(start)} to ${fmtDay(t)}</div><div class="mlab">${labs}</div><div class="hm">${cells}</div>${legend()}</div>
 ${summary('Average won',ps.pct,trend,`${ps.won} of ${ps.res} fights won`)}
 <div class="card"><div class="label">% won per month</div><div class="bars">${months.map(m=>`<div class="bar"><em>${m.p==null?'·':Math.round(m.p*100)}</em><div class="bt"><div class="bv lv-${lvlPct(m.p)}" style="height:${m.p==null?4:Math.max(6,m.p*100)}%"></div></div><span>${m.l}</span></div>`).join('')}</div></div>`;}

// REVIEW: only what went wrong
function lossInsights(endD){const t=today(),end=endD>t?t:endD,start=addDays(end,-27);
 let lost=0,exc=0,evt=0,tot=0;const tb={Morning:[0,0],Afternoon:[0,0],Evening:[0,0]},wd=Array.from({length:7},()=>[0,0]);
 for(let d=new Date(start);d<=end;d=addDays(d,1)){const ds=ymd(d);for(const f of fightsOn(ds)){const e=eff(f);if(e==='pending')continue;tot++;
  const h=+f.time.slice(0,2),k=h<12?'Morning':h<17?'Afternoon':'Evening';tb[k][1]++;const w=dowIdx(d);wd[w][1]++;
  if(e==='missed'){lost++;tb[k][0]++;wd[w][0]++;if(f.reason==='excuse')exc++;else if(f.reason==='event')evt++;}}}
 if(tot<5)return['Keep logging. Patterns show up after one or two weeks of fights.'];
 if(!lost)return['No losses in the last 4 weeks. Make the next fight a little harder.'];
 const out=[],P=x=>Math.round(x*100)+'%';
 if(exc+evt>0){const sh=exc/(exc+evt);
  if(sh>=.6)out.push(`${P(sh)} of your explained losses were excuses, not events. That part is fully in your control.`);
  else if(sh<=.3)out.push('Most losses came from unplanned events. Give each fight a backup time.');
  else out.push(`Excuses and real events are mixed (${exc} vs ${evt}). Read the notes below and be honest which is which.`);}
 let wk=null,wr=0;for(const k in tb){const[l,n]=tb[k];if(n>=3&&l/n>wr){wr=l/n;wk=k;}}
 if(wk&&wr>=.4)out.push(`You lose ${P(wr)} of your ${wk.toLowerCase()} fights. Move the hardest one to another part of the day.`);
 let wi=-1,wp=0;wd.forEach(([l,n],i)=>{if(n>=3&&l/n>wp){wp=l/n;wi=i;}});
 if(wi>=0&&wp>=.5)out.push(`${DOWL[wi]} is your weakest day (${P(wp)} lost). Plan one small fight only on that day.`);
 if(out.length<2)out.push('Look at the notes below. What do the hard moments have in common?');
 return out.slice(0,3);}
function viewReview(){const t=today(),all=st.rs==='all';
 const ws=addDays(mondayOf(t),7*st.rv),we=addDays(ws,6),key=ymd(ws),nk=ymd(addDays(mondayOf(t),7));
 const r=db.reviews[key]||{},nr=db.reviews[nk]||{};
 const cur=all?lossesIn(new Date(2000,0,1),t):lossesIn(ws,we),prev=lossesIn(addDays(ws,-7),addDays(ws,-1));
 const exc=cur.L.filter(f=>f.reason==='excuse').length,evt=cur.L.filter(f=>f.reason==='event').length,non=cur.L.length-exc-evt;
 const lp=cur.tot?cur.L.length/cur.tot:null,pp=prev.tot?prev.L.length/prev.tot:null;
 let ch='';if(!all&&lp!=null&&pp!=null){const d=Math.round((lp-pp)*100);ch=`<span class="chip ${d<0?'up':d>0?'down':'flat'}">${d>0?'+':''}${d} pts vs last week</span>`;}
 let pills='';if(!all)for(let i=0;i<7;i++){const d=addDays(ws,i),s=dayStat(ymd(d));pills+=`<span class="lv-${lvl(s)}">${DOW[i][0]}</span>`;}
 const n=cur.L.length||1;
 const rr=(l,v,c)=>`<div class="rrow"><span>${l}</span><div class="rb"><i style="width:${Math.round(v/n*100)}%;background:${c}"></i></div><b>${v}</b></div>`;
 const items=cur.L.slice(0,150).map(f=>`<div class="loss"><div class="row"><span class="t" style="color:#E2A4A2">${f.time}</span><b style="font-weight:600">${esc(f.text)}</b></div><div class="row" style="margin-top:6px;gap:8px"><span class="rchip r-${f.reason||'none'}">${reasonTxt(f)}</span><span class="muted small">${fmtDay(parse(f.date))}</span></div>${f.note?`<p class="nt">"${esc(f.note)}"</p>`:''}</div>`).join('');
 after=()=>{const pa=$('#pattern');if(pa)pa.oninput=()=>{(db.reviews[key]=db.reviews[key]||{}).pattern=pa.value;save();};
  const fb=$('#setfocus');if(fb)fb.onclick=()=>{const v=$('#focus').value.trim();(db.reviews[nk]=db.reviews[nk]||{}).focus=v;save();toast(v?'Focus set for next week':'Focus cleared');};};
 return `<header class="top"><h1>Review</h1>${gear}</header>
 <div class="seg">${[['week','Week'],['all','All time']].map(([k,l])=>`<button class="${st.rs===k?'on':''}" data-rseg="${k}">${l}</button>`).join('')}</div>
 ${all?'':`<div class="card"><div class="nav" style="margin:0"><div><div class="label">${st.rv===0?'This week':'Week '+isoWeek(ws)}</div><div class="title">${ws.getDate()} ${MON[ws.getMonth()]} to ${we.getDate()} ${MON[we.getMonth()]}</div></div><div class="arrows"><button data-nav="rv,-1">${I.left}</button><button data-nav="rv,1" ${st.rv>=0?'disabled':''}>${I.right}</button></div></div><div class="pills">${pills}</div></div>`}
 <div class="card row between"><div><div class="label r">${all?'Lost, all time':'Lost this week'}</div><div class="huge">${pctTxt(lp)}</div>${ch}<p class="muted" style="margin-top:8px;font-size:13px">${cur.L.length} of ${cur.tot} fights lost</p></div>${ringBox(lp||0,76,'','#B5615F')}</div>
 <div class="card"><div class="label">Why you lost</div>${cur.L.length?rr('Excuse',exc,'var(--miss)')+rr('Unplanned event',evt,'#8B949E')+(non?rr('No reason given',non,'#3A3F47'):''):'<p class="muted" style="margin-top:8px">Nothing lost here.</p>'}</div>
 <div class="card insight"><div class="label r">What the pattern says</div><ul class="ins">${lossInsights(all?t:we).map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <div class="card"><div class="label">${all?'Every loss and your notes':'Losses and your notes'}</div>${items||'<p class="muted" style="margin-top:8px">No losses here. Keep your fights honest and small.</p>'}</div>
 ${all?'':`<div class="card"><div class="label">What pattern do you see?</div><textarea id="pattern" rows="3" placeholder="One honest sentence about why you lost">${esc(r.pattern||'')}</textarea></div>
 <div class="card"><div class="label g">One change for next week</div><textarea id="focus" rows="2" placeholder="If I feel the urge to escape, then I stay and do 10 minutes.">${esc(nr.focus||'')}</textarea><button class="btn pri" id="setfocus">Set next week</button></div>`}`;}

function openSheet(html){$('#sheet').innerHTML='<div class="handle"></div>'+html;$('#sw').classList.add('open');}

$('#sw').addEventListener('click',e=>{if(e.target.id==='sw')closeSheet();});
function setStatus(id,status,note,reason){const f=db.fights.find(x=>x.id===id);if(!f)return;f.status=status;f.doneAt=(status==='won'&&f.date===ymd(today()))?nowHM():null;
 if(note!==undefined)f.note=note;f.reason=status==='missed'?(reason!==undefined?reason:(f.reason||null)):null;save();}
function openMiss(id){let reason=null;
 openSheet(`<div class="label r">Not today</div><h2>Noticing counts.</h2><p class="muted">Be honest. Why not today?</p>
 <div class="reasons"><button class="rsn" data-r="excuse"><b>Excuse</b><span>I chose comfort over the fight</span></button><button class="rsn" data-r="event"><b>Unplanned important event</b><span>Something real and important came up</span></button></div>
 <textarea id="note" rows="2" maxlength="140" placeholder="What exactly happened? (optional)"></textarea>

 const sh=$('#sheet');

function openPlanner(ds){const t=today(),isTom=ds===ymd(addDays(t,1)),isToday=ds===ymd(t);
 const locked=fightsOn(ds).filter(f=>f.status!=='pending'),max=3-locked.length;
 if(max<=0){toast('This day already has 3 fights');return;}
 let rows=fightsOn(ds).filter(f=>f.status==='pending').map(f=>({time:f.time,text:f.text}));
 if(!rows.length)rows=[{time:isToday?nextHour():'07:00',text:''}];
 const when=isTom?'tomorrow':isToday?'today':'that day';
 const draw=()=>{openSheet(`<div class="label g">${I.moon} ${isTom?'Night plan':'Plan'}</div>
  <h2>${isTom?'Tomorrow I will fight':isToday?'Today I will fight':fmtDay(parse(ds))+', I will fight'}</h2><p class="muted">Small, specific, with a time.</p>
  ${locked.map(f=>`<div class="prow locked"><span class="t">${f.time}</span><span>${esc(f.text)}</span></div>`).join('')}
  ${rows.map((r,i)=>`<div class="prow"><input type="time" class="tin" data-i="${i}" value="${r.time}"><input class="txt" data-i="${i}" maxlength="60" placeholder="What will you face?" value="${esc(r.text)}">${rows.length>1?`<button class="rm" data-rm="${i}" aria-label="Remove">${I.x}</button>`:''}</div>`).join('')}
  ${rows.length<max?`<button class="link" id="addf">${I.plus} Add fight</button>`:''}
  <p class="hint">3 is the maximum. Fewer is stronger.</p>
  <div class="card tip"><b>Can you finish each one ${when}?</b><p class="muted">If one feels heavy, make it smaller.</p></div>
  <button class="btn pri glow" id="commit">${I.check} Commit</button><button class="btn ghost" id="cancel">Cancel</button>`);
  const sh=$('#sheet');
  sh.querySelectorAll('.tin').forEach(el=>el.oninput=()=>{rows[+el.dataset.i].time=el.value;});
  sh.querySelectorAll('.txt').forEach(el=>el.oninput=()=>{rows[+el.dataset.i].text=el.value;});
  sh.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>{rows.splice(+el.dataset.rm,1);draw();});
  const add=$('#addf');if(add)add.onclick=()=>{rows.push({time:rows.length?'19:00':'07:00',text:''});draw();};
  $('#cancel').onclick=closeSheet;
  $('#commit').onclick=()=>{const ok=rows.filter(r=>r.text.trim());if(!ok.length){toast('Write at least one fight');return;}
   db.fights=db.fights.filter(f=>!(f.date===ds&&f.status==='pending'));
   ok.forEach(r=>db.fights.push({id:uid(),date:ds,time:r.time||'09:00',text:r.text.trim(),status:'pending',doneAt:null,note:'',reason:null}));
   save();closeSheet();render();toast(isTom?'Committed. Rest well.':'Committed.');};};
 draw();}

// actions
async function shareFile(name,text,type){const file=new File([text],name,{type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return;}catch(e){if(e.name==='AbortError')return;}}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
function demo(){const t=today(),texts=['Run 5 km','Prepare 2 interview cases','No cigarette today','Speak up in the meeting','Gym session','Call instead of email','Stay until the meeting ends','Ask one question'],times=['06:30','13:00','19:00'],notes=['Too tired, stayed on the couch','Meeting ran late','Scrolled my phone instead','Family dinner came up','Felt anxious and postponed',''];
 for(let i=180;i>=1;i--){if(Math.random()<.15)continue;const d=addDays(t,-i),n=1+Math.floor(Math.random()*3),prog=1-i/180;
  for(let k=0;k<n;k++){const won=Math.random()<(.4+.45*prog-(n===3?.12:0));db.fights.push({id:uid(),date:ymd(d),time:times[k],text:texts[Math.floor(Math.random()*texts.length)],status:won?'won':'missed',doneAt:null,note:won?'':notes[Math.floor(Math.random()*notes.length)],reason:won?null:(Math.random()<.65?'excuse':'event'),demo:true});}}
 save();}
function doAct(a){
 if(a==='settings')return openSettings();
 if(a==='exp-json')return shareFile('face-it-backup-'+ymd(today())+'.json',JSON.stringify(db,null,1),'application/json');
 if(a==='imp-json')return $('#imp').click();
 if(a==='exp-csv'){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['date','time','fight','status','reason','won_at','note']].concat(db.fights.slice().sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)).map(f=>[f.date,f.time,f.text,eff(f),eff(f)==='missed'?reasonTxt(f):'',f.doneAt||'',f.note||'']));return shareFile('face-it-'+ymd(today())+'.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');}
 if(a==='demo'){if(confirm('Add 6 months of sample data to preview the app? You can remove it later in Settings.')){demo();closeSheet();render();toast('Sample data loaded');}return;}
 if(a==='undemo'){db.fights=db.fights.filter(f=>!f.demo);save();closeSheet();render();toast('Sample data removed');return;}
 if(a==='wipe'){if(confirm('Erase all fights and reviews? This cannot be undone.')){db={fights:[],reviews:{}};save();closeSheet();render();toast('All data erased');}return;}}
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.fights))throw 0;db={fights:d.fights,reviews:d.reviews||{}};save();closeSheet();render();toast('Backup restored');}catch(err){toast('That file is not a Face It backup');}e.target.value='';};
 r.readAsText(f);});

document.addEventListener('click',e=>{const b=e.target.closest('[data-tab],[data-won],[data-miss],[data-undo],[data-plan],[data-seg],[data-rseg],[data-nav],[data-day],[data-act],[data-set]');if(!b||b.disabled)return;const d=b.dataset;
 if(d.tab){st.tab=d.tab;render();window.scrollTo(0,0);return;}
 if(d.won){setStatus(d.won,'won');if(navigator.vibrate)navigator.vibrate(12);render();toast('Won. You kept your word.');return;}
 if(d.miss)return openMiss(d.miss);
 if(d.undo){setStatus(d.undo,'pending','');render();return;}
 if(d.plan)return openPlanner(d.plan);
 if(d.seg){st.map=d.seg;render();return;}
 if(d.rseg){st.rs=d.rseg;render();return;}
 if(d.nav){const[k,v]=d.nav.split(',');st[k]=Math.min(0,st[k]+Number(v));render();return;}
 if(d.day)return openDay(d.day);
 if(d.set){const[id,s,ds]=d.set.split('|');if(s==='missed')return openMiss(id);setStatus(id,s);openDay(ds);render();return;}
 if(d.act)doAct(d.act);});

function toast(m){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);}el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900);}
function render(){after=null;$('#app').innerHTML=st.tab==='fight'?viewFight():st.tab==='map'?viewMap():viewReview();
 $('#tabs').innerHTML=[['fight','Fight',I.fight],['map','Map',I.map],['review','Review',I.cal]].map(([k,l,ic])=>`<button class="${st.tab===k?'on':''}" data-tab="${k}">${ic}<span>${l}</span></button>`).join('');
 if(after)after();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sw').classList.contains('open'))render();});

// home screen icon for iPhone
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0B0E13';x.fillRect(0,0,180,180);x.strokeStyle='#3FB950';x.lineWidth=12;x.beginPath();x.arc(90,90,52,0,Math.PI*2);x.stroke();x.fillStyle='#67DF70';x.beginPath();x.arc(90,90,20,0,Math.PI*2);x.fill();const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
})();
</script>
</body>
